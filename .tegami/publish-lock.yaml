core:changelogs:
  - content: "---\npackages:\n  npm:tegami:\n    type: minor\n---\n\n### Publish npm packages under aliases\n\n`npm.alias` in package options publishes a package under extra names. An alias shares the version, changelog, git tag, and dist-tag of the package:\n\n```ts\ntegami({\n  packages: {\n    \"@acme/ui\": { npm: { alias: [\"acme-ui\"] } },\n  },\n});\n```\n\nEach name is published from the package directory with the manifest name swapped for the duration of the publish, so lifecycle scripts rebuild for every name and a build that reads `package.json` sees the alias. Names the registry already has are skipped, so a retry only publishes what is missing. `tegami npm pretrust` configures trusted publishing for aliases too.\n"
    filename: 2026-09-03-5b8e1c.md
    v: 0.0.0
